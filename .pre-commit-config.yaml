default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: format
        name: Format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true

      - id: lint
        name: Lint
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: true

      - id: typecheck
        name: Typecheck
        entry: make typecheck
        language: system
        types: [python]
        pass_filenames: false
        stages: [manual]

      - id: test
        name: Test
        entry: make test
        language: system
        pass_filenames: false
        stages: [manual]
